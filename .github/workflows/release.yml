name: Build and publish experimental XPI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build XPI from source
        run: python3 scripts/build.py
      - name: Verify reproducibility and checksum
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          cp "dist/tb-reemail-$version.xpi" /tmp/first.xpi
          python3 scripts/build.py
          cmp /tmp/first.xpi "dist/tb-reemail-$version.xpi"
          (cd dist && sha256sum -c "tb-reemail-$version.xpi.sha256")

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and publish a new version as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          python3 scripts/build.py
          gh release create "v$version" "dist/tb-reemail-$version.xpi" "dist/tb-reemail-$version.xpi.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "v$version (experimental)" --notes-file RELEASE_NOTES.md
