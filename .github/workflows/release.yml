name: Publish experimental XPI v0.5.0

on:
  push:
    branches: [main]
    paths:
      - 'dist/tb-reemail-0.5.0.xpi'
      - 'dist/tb-reemail-0.5.0.xpi.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate JavaScript and tests
        run: |
          node --check background.js
          node --check api/implementation.js
          node tests/test.cjs
          node tests/quick.cjs
      - name: Verify published XPI checksum
        run: cd dist && sha256sum -c tb-reemail-0.5.0.xpi.sha256
      - name: Publish or update v0.5.0 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 --clobber dist/tb-reemail-0.5.0.xpi dist/tb-reemail-0.5.0.xpi.sha256
          else
            gh release create v0.5.0 dist/tb-reemail-0.5.0.xpi dist/tb-reemail-0.5.0.xpi.sha256 --target "$GITHUB_SHA" --prerelease --title "v0.5.0 (experimental)" --notes-file RELEASE_NOTES.md
          fi
