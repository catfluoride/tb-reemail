name: Publish experimental XPI

on:
  push:
    branches: [main]
    paths:
      - 'dist/caldav-email-valarm-0.4.0.xpi'
      - 'dist/caldav-email-valarm-0.4.0.xpi.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify XPI checksum
        run: cd dist && sha256sum -c caldav-email-valarm-0.4.0.xpi.sha256
      - name: Publish v0.4.0 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo 'Release v0.4.0 already exists; refreshing binary and checksum.'
            gh release upload v0.4.0 --clobber dist/caldav-email-valarm-0.4.0.xpi dist/caldav-email-valarm-0.4.0.xpi.sha256
          else
            gh release create v0.4.0 dist/caldav-email-valarm-0.4.0.xpi dist/caldav-email-valarm-0.4.0.xpi.sha256 \
              --target "$GITHUB_SHA" --prerelease \
              --title 'v0.4.0 (experimental)' --notes-file RELEASE_NOTES.md
          fi
