name: Import tb-reemail sources and publish v0.4.0
on:
  push:
    branches: [main]
    paths: [source-import.tar.xz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack complete repository
        shell: bash
        run: |
          set -euo pipefail
          test -f source-import.tar.xz
          tar -xJf source-import.tar.xz
          cp -a tb-reemail/. .
          rm -rf tb-reemail source-import.tar.xz .github/workflows/import.yml
          cd dist
          sha256sum -c caldav-email-valarm-0.4.0.xpi.sha256
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish tb-reemail source, documentation, and v0.4.0 XPI"
          git push origin HEAD:main
      - name: Publish v0.4.0 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 --clobber dist/caldav-email-valarm-0.4.0.xpi dist/caldav-email-valarm-0.4.0.xpi.sha256
          else
            gh release create v0.4.0 dist/caldav-email-valarm-0.4.0.xpi dist/caldav-email-valarm-0.4.0.xpi.sha256 --target main --prerelease --title "v0.4.0 (experimental)" --notes-file RELEASE_NOTES.md
          fi
