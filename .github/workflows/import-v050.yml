name: Import and publish tb-reemail v0.5.0
on:
  push:
    branches: [main]
    paths:
      - '.tb-reemail-v050.tar.xz'
      - '.tb-reemail-v050-retry.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack and validate v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          test -f .tb-reemail-v050.tar.xz
          tar -xJf .tb-reemail-v050.tar.xz --exclude='./.github/workflows/release.yml'
          rm -f .tb-reemail-v050.tar.xz .tb-reemail-v050-retry.txt
          node --check background.js
          node --check api/implementation.js
          node tests/test.cjs
          node tests/quick.cjs
          (cd dist && sha256sum -c tb-reemail-0.5.0.xpi.sha256)
          test "$(node -p "require('./manifest.json').version")" = "0.5.0"
      - name: Commit complete v0.5.0 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish tb-reemail v0.5.0 source and installable XPI"
          git push origin HEAD:main
      - name: Create public v0.5.0 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 --clobber dist/tb-reemail-0.5.0.xpi dist/tb-reemail-0.5.0.xpi.sha256
          else
            gh release create v0.5.0 dist/tb-reemail-0.5.0.xpi dist/tb-reemail-0.5.0.xpi.sha256 --target "$(git rev-parse HEAD)" --prerelease --title "v0.5.0 (experimental)" --notes-file RELEASE_NOTES.md
          fi
